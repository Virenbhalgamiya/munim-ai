# One-click deploy on Render (free): https://render.com/deploy?repo=<this repo's GitHub URL>
# Runs the hosted PUBLIC DEMO: no login, demo shop data, reminders simulated (no real Telegram/SMS).
services:
  - type: web
    name: munim-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.serve
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_DEMO
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: DEV_MODE
        value: "false"
      - key: VOICE_ENGINE
        value: neural
      - key: ASK_RATE_PER_MINUTE
        value: "15"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_FALLBACK_MODELS
        value: openai/gpt-oss-20b,qwen/qwen3.8-27b,openai/gpt-oss-safeguard-20b
      - key: GROQ_API_KEY
        sync: false        # you paste it in Render's dashboard; never stored in GitHub
      - key: GEMINI_API_KEY
        sync: false        # optional backup AI
